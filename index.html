<body>
<style>
/* Layout: one-screen mobile game. Fixed brand chrome (3D candy buttons, cream panels with ribbons, outlined game text);
   each block style supplies its own sky, board frame and blocks. */
:root{
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-ui:"Fredoka","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;
  --p-ink:#6b3f22;--p-sub:#a87652;--p-bg1:#fffbf2;--p-bg2:#ffe9c9;--p-edge:#eaa95f;--p-edge-d:#b8732f;
  --sky1:#5a4ad6;--sky2:#1d1858;--glow:rgba(160,140,255,.6);--frame:#7e8cff;--frame-d:#4550d0;--frame-lip:#262c8c;--well:#191b4d;--cell:#272a6a;--ol:#1a1450;
  --bg-art:none;--bg-size:auto;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--sky2);
  background-image:var(--bg-art),radial-gradient(130% 85% at 50% 40%,transparent 55%,rgba(40,10,40,.16)),radial-gradient(60% 40% at 50% 46%,rgba(255,255,255,.28),transparent 70%),radial-gradient(80% 45% at 50% -6%,var(--glow),transparent 72%),linear-gradient(180deg,var(--sky1),var(--sky2));
  background-size:var(--bg-size),100% 100%,100% 100%,100% 100%,100% 100%;
  color:#fff;font-family:var(--font-ui);font-weight:600;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
/* soft bokeh lights over every sky */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(140px 140px at 6% 16%,rgba(255,255,255,.22),transparent 70%),
    radial-gradient(200px 200px at 96% 30%,rgba(255,255,255,.16),transparent 70%),
    radial-gradient(160px 160px at 14% 78%,rgba(255,255,255,.14),transparent 70%),
    radial-gradient(240px 240px at 88% 92%,rgba(255,255,255,.12),transparent 70%)}
.app{position:relative;box-sizing:border-box;height:100%;max-width:480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.screen{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6dvh,14px)}
#scrGame{justify-content:center;gap:clamp(10px,2.2dvh,20px)}
.col{width:min(100%,max(240px,calc(100vh - 318px)));width:min(100%,max(240px,calc(100dvh - 318px)))}

/* ---------- Outlined game text ---------- */
.ot{color:#fff;--ow:2px;text-shadow:
  var(--ow) 0 0 var(--ol),calc(var(--ow)*-1) 0 0 var(--ol),0 var(--ow) 0 var(--ol),0 calc(var(--ow)*-1) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*.75) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*-.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*-.75) 0 var(--ol),
  0 calc(var(--ow)*2) 0 var(--ol),var(--ow) calc(var(--ow)*2) 0 var(--ol),calc(var(--ow)*-1) calc(var(--ow)*2) 0 var(--ol),
  0 calc(var(--ow)*3) 6px rgba(0,0,0,.25)}
.ot.lg{--ow:3px}
.ot.xl{--ow:4px}

/* ---------- 3D candy buttons ---------- */
.gbtn{--b1:#8aea62;--b2:#45bb34;--b3:#2b8a20;--ol:#2a7a1e;
  position:relative;isolation:isolate;border:0;margin:0;cursor:pointer;border-radius:20px;padding:0 26px;height:58px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:400 25px/1 var(--font-display);letter-spacing:.4px;color:#fff;
  background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 var(--b3),0 12px 18px rgba(0,0,0,.22);
  transition:transform .07s ease-out,box-shadow .07s ease-out}
.gbtn::before{content:"";position:absolute;z-index:-1;left:7px;right:7px;top:4px;height:42%;border-radius:15px 15px 40% 40%/15px 15px 26% 26%;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.08))}
.gbtn:active{transform:translateY(5px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--b3),0 3px 6px rgba(0,0,0,.22)}
.gbtn:focus-visible,.ibtn:focus-visible,.skin-card:focus-visible{outline:3px solid #fff;outline-offset:4px}
.gbtn.orange{--b1:#ffc65e;--b2:#ff8f1f;--b3:#c25e0a;--ol:#b0520a}
.gbtn.blue{--b1:#74d4ff;--b2:#2f8ff0;--b3:#1b5eb3;--ol:#1a55a1}
.gbtn.pink{--b1:#ffa2cf;--b2:#f2559b;--b3:#b02f6a;--ol:#a12a60}
.gbtn.purple{--b1:#c7a1ff;--b2:#8a5cf0;--b3:#5a34b3;--ol:#4f2fa3}
.gbtn.red{--b1:#ff8a8a;--b2:#e64545;--b3:#a62626;--ol:#962222}
.gbtn.cream{--b1:#fffaf0;--b2:#ffe8c8;--b3:#d8b585;color:var(--p-ink)}
.gbtn.cream::before{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.2))}
.gbtn.cream span{text-shadow:0 2px 0 rgba(255,255,255,.8)}
.gbtn.sm{height:48px;font-size:21px;border-radius:16px;padding:0 20px}
.gbtn.wide{width:100%}
.gbtn svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 2px 0 var(--ol))}

/* round icon button */
.ibtn{--b1:#74d4ff;--b2:#2f8ff0;--b3:#1b5eb3;--ol:#1a55a1;
  position:relative;isolation:isolate;flex:none;width:48px;height:48px;border:0;margin:0;padding:0;border-radius:16px;cursor:pointer;color:#fff;
  display:grid;place-items:center;background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 var(--b3),0 9px 14px rgba(0,0,0,.2);
  transition:transform .07s ease-out,box-shadow .07s ease-out}
.ibtn::before{content:"";position:absolute;z-index:-1;left:5px;right:5px;top:3px;height:42%;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.06))}
.ibtn:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--b3),0 3px 6px rgba(0,0,0,.2)}
.ibtn svg{width:24px;height:24px;filter:drop-shadow(0 2px 0 var(--ol))}
.ibtn.pink{--b1:#ffa2cf;--b2:#f2559b;--b3:#b02f6a;--ol:#a12a60}
.ibtn.orange{--b1:#ffc65e;--b2:#ff8f1f;--b3:#c25e0a;--ol:#b0520a}
.spacer{width:48px;flex:none}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 4px;border-radius:99px;
  background:rgba(30,12,50,.32);box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.35);
  font:400 19px/1 var(--font-display);font-variant-numeric:tabular-nums;--ol:rgba(30,12,50,.6)}
.pill .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%,#fff3a8,#ffc21f 60%,#e08a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.2)}
.pill .ico svg{width:18px;height:18px}
.pill .ico.pinkc{background:radial-gradient(circle at 40% 35%,#ffd0e6,#ff6fae 60%,#d63a80)}

.pill.cream{background:linear-gradient(180deg,#fffbf2,#fff0d6);color:#7a4a10;box-shadow:0 0 0 2px #f0d9a8,0 3px 0 #d9b98c,0 6px 10px rgba(0,0,0,.12)}
.pill .mini{font:700 10px/1 var(--font-ui);letter-spacing:.12em;color:#b08050;margin-right:-2px}
/* cream panel with ribbon */
.panel{position:relative;background:linear-gradient(180deg,var(--p-bg1),var(--p-bg2));border-radius:26px;color:var(--p-ink);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.9),inset 0 -6px 0 rgba(184,115,47,.16),0 0 0 3px var(--p-edge),0 7px 0 3px var(--p-edge-d),0 16px 26px rgba(0,0,0,.25)}
.ribbon{--rb1:#ff93bd;--rb2:#ea4f8c;--rb3:#b3306a;--rt:#c93a73;--ol:#9e2459;
  position:absolute;left:50%;top:0;transform:translate(-50%,-56%);z-index:2;min-width:70%;max-width:104%;height:54px;padding:0 26px;box-sizing:border-box;
  display:grid;place-items:center;white-space:nowrap;font:400 27px/1 var(--font-display);
  background:linear-gradient(180deg,var(--rb1),var(--rb2));border-radius:12px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.14),0 5px 0 var(--rb3),0 10px 14px rgba(0,0,0,.18)}
.ribbon::before,.ribbon::after{content:"";position:absolute;z-index:-1;top:16px;width:30px;height:44px;background:var(--rt)}
.ribbon::before{left:-28px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,34% 50%)}
.ribbon::after{right:-28px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,66% 50%);transform:scaleX(-1)}
.ribbon.green{--rb1:#9cef72;--rb2:#46bb36;--rb3:#2b8a20;--rt:#36a02a;--ol:#26781c}
.ribbon.blue{--rb1:#7dd8ff;--rb2:#3192f0;--rb3:#1b5eb3;--rt:#2477d6;--ol:#1a55a1}
.ribbon.red{--rb1:#ff9090;--rb2:#e64545;--rb3:#a62626;--rt:#c73636;--ol:#962222}
.ribbon.purple{--rb1:#c9a5ff;--rb2:#8a5cf0;--rb3:#5a34b3;--rt:#7448d8;--ol:#4f2fa3}
.ribbon.gold{--rb1:#ffe27a;--rb2:#ffad1f;--rb3:#c27508;--rt:#e08f10;--ol:#a35e05}
.ribbon > span{position:relative;top:-1px}

/* ---------- Home ---------- */
.home{justify-content:space-between;padding-bottom:4px}
.home-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}
.float-piece{position:absolute;animation:bob 4.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.float-piece .piece{transform:rotate(var(--rot))}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.logo{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;margin-top:auto}
.tiles{display:flex;gap:5px}
.tiles .blk{width:clamp(48px,14vw,62px);aspect-ratio:1;display:grid;place-items:center}
.tiles .blk:nth-child(odd){transform:rotate(-6deg) translateY(3px)}
.tiles .blk:nth-child(even){transform:rotate(5deg)}
.tiles b{position:relative;z-index:5;font:400 clamp(32px,9.4vw,42px)/1 var(--font-display)}
.tiles .blk{animation:hop 3.6s ease-in-out infinite}
.tiles .blk:nth-child(2){animation-delay:.12s}.tiles .blk:nth-child(3){animation-delay:.24s}.tiles .blk:nth-child(4){animation-delay:.36s}.tiles .blk:nth-child(5){animation-delay:.48s}
@keyframes hop{0%,70%,100%{translate:0 0}78%{translate:0 -10px}86%{translate:0 0}}
.wordmark{position:relative;margin-top:-6px;font:400 clamp(70px,22vw,98px)/1 var(--font-display);letter-spacing:1px}
.wordmark span{position:relative;z-index:1;color:transparent;background:linear-gradient(180deg,#fffbd0 8%,#ffe066 40%,#ffb627 72%,#ff8a1f 100%);-webkit-background-clip:text;background-clip:text}
.wordmark::before{content:attr(data-text);position:absolute;inset:0;z-index:0;color:#c2531f;--ol:#8a3210;--ow:5px;
  text-shadow:var(--ow) 0 0 var(--ol),calc(var(--ow)*-1) 0 0 var(--ol),0 var(--ow) 0 var(--ol),0 calc(var(--ow)*-1) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*.75) calc(var(--ow)*-.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*-.75) 0 var(--ol),
  0 8px 0 var(--ol),5px 8px 0 var(--ol),-5px 8px 0 var(--ol),0 14px 18px rgba(0,0,0,.28)}
.tagline{margin-top:6px;font-size:15px;--ol:var(--ol)}
.menu{position:relative;z-index:1;width:min(100%,340px);display:flex;flex-direction:column;gap:18px;margin-top:auto;margin-bottom:auto}
.mode{height:84px;width:100%;justify-content:flex-start;padding:0 16px;gap:14px;border-radius:26px}
.mode::before{border-radius:20px 20px 40% 40%/20px 20px 26% 26%}
.mode-ico{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.08)}
.mode-ico svg{width:34px;height:34px}
.mode-txt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.mode-t{font-size:31px}
.mode-s{font:700 13px/1 var(--font-ui);padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.18);text-shadow:none;letter-spacing:.2px}
.style-btn{height:70px}
.style-btn .mode-ico{width:48px;height:48px}
.style-btn .mode-t{font-size:26px}
.style-btn .sw{display:grid;grid-template-columns:repeat(2,17px);gap:3px}
.style-btn .sw .blk{width:17px;height:17px}
.foot{position:relative;z-index:1;margin:0;padding:6px 14px;border-radius:99px;background:rgba(30,12,50,.28);font-size:12px;font-weight:600;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}

/* ---------- Common top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.topbar .title{flex:1;text-align:center;font:400 28px/1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0 10px}

/* ---------- Styles picker ---------- */
.style-grid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;padding:8px 6px 26px;align-content:start;box-sizing:border-box}
.skin-card{position:relative;border:0;margin:0;padding:9px 9px 10px;border-radius:22px;cursor:pointer;font:inherit;color:#fff;
  background-color:var(--sky2);background-image:var(--bg-art),radial-gradient(90% 60% at 50% -10%,var(--glow),transparent 70%),linear-gradient(180deg,var(--sky1),var(--sky2));
  background-size:var(--bg-size),100% 100%,100% 100%;display:flex;flex-direction:column;gap:8px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 3px rgba(255,255,255,.9),0 7px 0 3px rgba(0,0,0,.12),0 12px 18px rgba(0,0,0,.18);transition:transform .1s}
.skin-card:active{transform:scale(.97)}
.skin-card.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 4px #ffd84a,0 0 0 7px #e5901a,0 8px 0 5px rgba(0,0,0,.14),0 0 26px 8px rgba(255,214,74,.55)}
.skin-frame{padding:5px;border-radius:15px;background:linear-gradient(180deg,var(--frame),var(--frame-d));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--frame-lip)}
.skin-board{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;border-radius:11px;background:var(--well);box-shadow:inset 0 2px 4px rgba(0,0,0,.16)}
.skin-board .cell{aspect-ratio:1}
.skin-name{font:400 19px/1.1 var(--font-display);text-align:center;padding-top:2px}
.skin-check{position:absolute;top:-9px;right:-9px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;z-index:3;
  background:linear-gradient(180deg,#8aea62,#3fae30);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #2b8a20,0 0 0 3px #fff}
.skin-check svg{width:18px;height:18px;filter:drop-shadow(0 1px 0 #2a7a1e)}
.skin-card:not(.on) .skin-check{display:none}
.grid-head{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 4px 0}
.grid-head span{font:400 24px/1 var(--font-display)}
.grid-head small{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(30,12,50,.28)}
.new-tag{position:absolute;top:-8px;left:-6px;z-index:3;padding:4px 8px;border-radius:9px;font:400 12px/1 var(--font-display);color:#fff;letter-spacing:.06em;
  background:linear-gradient(180deg,#ff8a8a,#e64545);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 #a62626,0 0 0 2px #fff;rotate:-8deg}

/* ---------- Adventure map ---------- */
.map{gap:clamp(10px,2dvh,18px)}
.map-panel{width:100%;max-width:400px;flex:1;min-height:0;margin-top:30px;margin-bottom:6px;padding:42px 16px 18px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--p-sub)}
.pic-stage{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.pic{display:grid}
.pc-empty{background:color-mix(in srgb,var(--c,#d9b48a) 26%,#f1e1ca);border-radius:24%;box-shadow:inset 0 2px 3px rgba(120,70,30,.22)}
.newfill{animation:fillin .7s cubic-bezier(.3,1.6,.5,1) .35s both}
@keyframes fillin{0%{transform:scale(0);filter:brightness(2)}100%{transform:scale(1)}}
.bar{position:relative;width:min(100%,280px);height:28px;border-radius:99px;background:#e9cfae;box-shadow:inset 0 3px 4px rgba(120,70,30,.28),0 2px 0 #fff}
.bar i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:99px;min-width:22px;background:linear-gradient(180deg,#a8f27a,#4cc23a);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12);transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:400 17px/1 var(--font-display);--ol:#5a3a1e}
.alldone{margin:0;color:#2f8a3d;font-weight:700;font-size:14px;text-align:center}
.play-big{height:70px;font-size:32px;padding:0 44px;border-radius:24px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}
.shelf{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.shelf-item{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(30,12,50,.22);box-shadow:inset 0 2px 5px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.35)}
.shelf-item.cur{background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 3px #ffd84a,0 0 14px rgba(255,216,74,.7)}
.shelf-item.locked .pic{opacity:.25;filter:grayscale(1)}
.shelf-item{position:relative}
.shelf-item .lock{position:absolute;inset:0;display:grid;place-items:center}
.shelf-item .lock svg{width:20px;height:20px;filter:drop-shadow(0 2px 0 rgba(30,12,50,.5))}

/* ---------- Game HUD ---------- */
.hud{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;justify-content:center}
.best-pill{height:28px;font-size:16px;padding-right:12px}
.best-pill .ico{width:24px;height:24px}
.best-pill .ico svg{width:14px;height:14px}
.score{font:400 clamp(44px,8dvh,56px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.score.bump{animation:sbump .3s ease-out}
@keyframes sbump{40%{scale:1.15}}
.combo{display:flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:99px;background:linear-gradient(180deg,#ffe27a,#ffad1f);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 #c27508;font:400 14px/1 var(--font-display);--ol:#a35e05;transition:opacity .2s,transform .2s}
.combo[data-off="1"]{opacity:0;transform:scale(.6)}
.pips{display:flex;gap:3px}
.pips b{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 1px 0 rgba(163,94,5,.6)}
.pips b.spent{background:rgba(255,255,255,.35)}
.goal-panel{display:flex;gap:6px;padding:6px 8px;border-radius:20px}
.goal{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:14px;font:400 26px/1 var(--font-display);color:var(--p-ink);font-variant-numeric:tabular-nums}
.goal .gs{width:30px;height:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.goal .chk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#8aea62,#3fae30);box-shadow:0 2px 0 #2b8a20}
.goal .chk svg{width:15px;height:15px}
.goal.bump{animation:bump .3s ease-out}
@keyframes bump{50%{transform:scale(1.18)}}
.lvl-pill{font-size:13px;height:26px;padding:0 12px}

/* ---------- Board ---------- */
.board-frame{position:relative;padding:8px;border-radius:24px;box-sizing:border-box;
  background:linear-gradient(180deg,var(--frame),var(--frame-d));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.14),0 7px 0 var(--frame-lip),0 16px 26px rgba(0,0,0,.25)}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;aspect-ratio:1;box-sizing:border-box;width:100%;
  background:var(--well);border-radius:17px;touch-action:none;box-shadow:inset 0 3px 7px rgba(0,0,0,.18)}
.cell{border-radius:24%;background:var(--cell);box-shadow:inset 0 3cqw 5cqw rgba(0,0,0,.12),inset 0 -1.5cqw 0 rgba(255,255,255,.4)}
.cell.w{z-index:1}
.cell.w .sk{filter:brightness(1.14) saturate(1.12)}
.cell.w::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.75),rgba(255,255,255,.15) 70%);animation:glint .55s ease-in-out infinite alternate}
@keyframes glint{from{opacity:.15}to{opacity:.75}}
/* "about to clear" light band across each full line */
.lineglow{position:absolute;pointer-events:none;border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 16px 5px rgba(255,226,120,.75),0 0 34px 10px rgba(255,200,80,.35);
  background:linear-gradient(90deg,rgba(255,250,215,.0),rgba(255,250,215,.28) 15% 85%,rgba(255,250,215,0));
  animation:lgin .18s ease-out,lgpulse .7s ease-in-out .18s infinite alternate}
.lineglow.v{background:linear-gradient(180deg,rgba(255,250,215,.0),rgba(255,250,215,.28) 15% 85%,rgba(255,250,215,0))}
.lineglow::after{content:"";position:absolute;inset:-20%;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);background-size:260% 100%;animation:shimmer 1s linear infinite;mix-blend-mode:screen}
.lineglow.v::after{background:linear-gradient(190deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);background-size:100% 260%;animation-name:shimmerV}
@keyframes lgin{from{opacity:0;transform:scale(.96)}}
@keyframes lgpulse{from{box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 10px 3px rgba(255,226,120,.6),0 0 24px 8px rgba(255,200,80,.25)}to{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 20px 7px rgba(255,226,120,.85),0 0 40px 12px rgba(255,200,80,.4)}}
@keyframes shimmer{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes shimmerV{from{background-position:0 130%}to{background-position:0 -130%}}
.cell.pop::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--pc);box-shadow:0 0 14px var(--pc);
  animation:pop .42s cubic-bezier(.3,.7,.4,1) var(--d,0ms) forwards}
@keyframes pop{0%{transform:scale(1.1);opacity:1;filter:brightness(1.8)}100%{transform:scale(.1) rotate(30deg);opacity:0}}
.board-frame.shake{animation:shake .34s ease-out}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.board.intro .cell.f{animation:drop .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 7ms)}
@keyframes drop{from{transform:scale(.2);opacity:0}}
.gs{clip-path:polygon(50% 0,100% 36%,50% 100%,0 36%);background:var(--gm);
  background:linear-gradient(150deg,#fff -30%,var(--gm) 42%,color-mix(in srgb,var(--gm),#000 40%) 100%)}
.cell .gs,.blk .gs{position:absolute;inset:16% 14%;display:none}
.cell.gem .gs,.blk .gs{display:block}
.cell.gem .gs{animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.gs.fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:block}

/* effects */
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:6}
.pt{position:absolute;border-radius:28%;pointer-events:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.5)}
.sweep{position:absolute;border-radius:10px;pointer-events:none;mix-blend-mode:screen}
.sweep.h{background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 30% 70%,transparent);animation:sweepH .5s ease-out forwards;box-shadow:0 0 18px 6px rgba(255,255,255,.55)}
.sweep.v{background:linear-gradient(180deg,transparent,rgba(255,255,255,.95) 30% 70%,transparent);animation:sweepV .5s ease-out forwards;box-shadow:0 0 18px 6px rgba(255,255,255,.55)}
@keyframes sweepH{0%{transform:scaleX(.05);opacity:1}60%{opacity:.9}100%{transform:scaleX(1.15) scaleY(.4);opacity:0}}
@keyframes sweepV{0%{transform:scaleY(.05);opacity:1}60%{opacity:.9}100%{transform:scaleY(1.15) scaleX(.4);opacity:0}}
.pop-score{position:absolute;transform:translate(-50%,-50%);font:400 30px/1 var(--font-display);--ol:#a35e05;color:#ffe46b;white-space:nowrap;animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;scale:.4}18%{opacity:1;scale:1.25}32%{scale:1}100%{opacity:0;translate:0 -54px}}
.banner{position:absolute;left:50%;top:44%;translate:-50% -50%;white-space:nowrap;padding:22px 44px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,10,30,.22),transparent);font:400 clamp(40px,11.5vw,54px)/1 var(--font-display);animation:bannerIn 1.35s cubic-bezier(.3,1.4,.5,1) forwards;color:#ffe46b;--ol:#8a3d00}
.banner.sub{top:60%;font-size:clamp(26px,7.5vw,34px)}
.banner.sub{color:#fff;--ol:#1a55a1;background:none}
.banner.green{color:#f0ffd8;--ol:#2b6a12}
@keyframes bannerIn{0%{opacity:0;scale:.2;rotate:-8deg}16%{opacity:1;scale:1.18;rotate:3deg}28%{scale:1;rotate:0deg}78%{opacity:1;translate:-50% -50%}100%{opacity:0;translate:-50% -90%}}
.conf{position:absolute;top:-4%;width:10px;height:14px;border-radius:3px;animation:fall var(--t,1.6s) cubic-bezier(.3,.4,.6,1) var(--dl,0s) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,0),108vh) rotate(var(--rot,540deg))}}

/* ---------- Tray ---------- */
.tray-shelf{border-radius:24px;padding:6px;box-sizing:border-box;background:rgba(255,255,255,.28);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.06),0 6px 14px rgba(0,0,0,.08)}
[data-bg="classic"] .tray-shelf,[data-bg="pixel"] .tray-shelf,[data-bg="star"] .tray-shelf{background:rgba(255,255,255,.08);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.2)}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,112px));justify-content:center;height:clamp(112px,18dvh,150px);touch-action:none}
.slot{display:grid;place-items:center;cursor:grab;border-radius:18px}
.piece{display:grid;transition:opacity .2s,filter .2s}
.piece.in{animation:dealt .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes dealt{from{opacity:0;transform:translateY(24px) scale(.4)}}
.slot.nofit .piece{opacity:.3;filter:grayscale(.8)}
.slot.dragging .piece{opacity:0}
.hint{margin:0;padding:7px 14px;border-radius:99px;background:rgba(30,12,50,.28);font-size:13px;font-weight:600;text-align:center;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform}
.drag .piece{animation:grab .14s ease-out;filter:drop-shadow(0 12px 10px rgba(0,0,0,.35))}
@keyframes grab{from{transform:scale(.5)}}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;
  background:rgba(28,12,48,.66);animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.rays{position:absolute;left:50%;top:46%;width:1000px;height:1000px;margin:-500px 0 0 -500px;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,236,160,.22) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 18%,transparent 52%);mask:radial-gradient(circle,#000 0 18%,transparent 52%);animation:spin 22s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.mpanel{position:relative;width:min(340px,100%);padding:50px 20px 24px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.mpanel .lbl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-sub)}
.mpanel .big{font:400 58px/1 var(--font-display);color:var(--p-ink);font-variant-numeric:tabular-nums}
.mpanel .sm{font:400 26px/1 var(--font-display);color:#e0890f;font-variant-numeric:tabular-nums}
.mpanel p{margin:0;color:var(--p-sub);font-weight:600;font-size:15px;text-wrap:balance}
.mpanel .goal-panel{background:rgba(184,115,47,.12);box-shadow:inset 0 2px 4px rgba(120,70,30,.15)}
.mbtns{display:flex;flex-direction:column;align-items:stretch;gap:16px;width:100%;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 14px;border-radius:99px;background:linear-gradient(180deg,#ffe27a,#ffad1f);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #c27508;font:400 17px/1 var(--font-display);--ol:#a35e05;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.stars3{display:flex;align-items:flex-end;gap:2px;margin-top:-2px}
.stars3 svg{width:62px;height:62px;filter:drop-shadow(0 4px 0 #c27508) drop-shadow(0 0 10px rgba(255,210,60,.6));animation:starpop .55s cubic-bezier(.3,1.8,.5,1) both}
.stars3 svg:nth-child(1){animation-delay:.35s;rotate:-12deg}
.stars3 svg:nth-child(2){width:80px;height:80px;margin-bottom:10px;animation-delay:.6s}
.stars3 svg:nth-child(3){animation-delay:.85s;rotate:12deg}
@keyframes starpop{0%{scale:.2;opacity:0}70%{scale:1.25;opacity:1}100%{scale:1}}
.mpanel .corners{display:flex;justify-content:center;gap:12px;margin:-6px 0 2px}
.mpanel .corner{width:40px;height:40px;border-radius:13px}
.mpanel .corner svg{width:21px;height:21px}
.mpanel .corner svg{width:22px;height:22px}
.mpanel.wide-ribbon .ribbon{min-width:104%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

/*SKINS-START*/
/* ===== Skin engine v2 ===================================================
   Each block holds <i class="sk">. The block sets --c (--k1..--k9; 9 = stone)
   and data-k. Blocks are size containers, so decoration uses cqw units.
   Every style also sets its scene: --sky1/--sky2/--glow (background),
   --frame/--frame-d/--frame-lip (board frame), --well/--cell (board inside),
   --ol (outline colour for white game text on that background).
   ====================================================================== */
.cell,.blk{position:relative;container-type:size}
.sk{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  --l1:color-mix(in srgb,var(--c),#fff 24%);
  --l2:color-mix(in srgb,var(--c),#fff 50%);
  --l3:color-mix(in srgb,var(--c),#fff 74%);
  --d1:color-mix(in srgb,var(--c),#000 9%);
  --d2:color-mix(in srgb,var(--c),#000 20%);
  --d3:color-mix(in srgb,var(--c),#000 34%);
  --ob:color-mix(in srgb,var(--c),#2b1236 46%);
  --gloss:radial-gradient(74% 40% at 50% 7%,rgba(255,255,255,.82),rgba(255,255,255,0) 76%);
}
.cell:not(.f):not(.w):not(.g) .sk{display:none}
.cell.f,.cell.w{background:transparent!important;box-shadow:none!important}
.cell.g .sk{opacity:.5}
.cell .gs,.blk .gs{z-index:3}
.cell.w::before{z-index:2}
.cell.pop::after{z-index:4}
.cell.land .sk{animation:land .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{scale:1.18 .82}50%{scale:.94 1.07}100%{scale:1 1}}
.tiny .sk::before,.tiny .sk::after{display:none!important}
.tiny .sk{inset:0!important;transform:none!important}
/* clean face-free tiles for the logo */
.plain .sk{inset:0!important;border-radius:26%!important;transform:none!important;filter:none!important;
  background:var(--gloss),linear-gradient(180deg,var(--l1),var(--c) 50%,var(--d2))!important;
  box-shadow:inset 0 -7cqw 3cqw var(--d2),inset 0 3cqw 0 rgba(255,255,255,.4),0 0 0 3cqw var(--ob),0 6cqw 6cqw rgba(0,0,0,.25)!important}
.plain .sk::before,.plain .sk::after{display:none!important}

<script>
(() => {
const N = 8, NCOL = 8, STONE = 9;
const kv = k => `var(--k${k})`;
const SKINS = [
  {id:'pic-gembuddies',name:'Gem Buddies',group:'pic',isNew:1},{id:'pic-sparklegems',name:'Sparkle Gems',group:'pic',isNew:1},{id:'pic-crystalcharms',name:'Crystal Charms',group:'pic',isNew:1},{id:'pic-crystalbloom',name:'Crystal Bloom',group:'pic',isNew:1},{id:'pic-jewelbox',name:'Jewel Box',group:'pic',isNew:1},{id:'pic-crystaldreams',name:'Crystal Dreams',group:'pic',isNew:1},{id:'pic-treasure',name:'Pirate Treasure',group:'pic',isNew:1},{id:'pic-pirategear',name:'Pirate Gear',group:'pic',isNew:1},{id:'pic-voyage',name:'Voyage',group:'pic',isNew:1},{id:'pic-shipahoy',name:'Ship Ahoy',group:'pic',isNew:1},{id:'pic-crew',name:'Pirate Crew',group:'pic',isNew:1},{id:'pic-island',name:'Island Friends',group:'pic',isNew:1},{id:'pic-hunt',name:'Treasure Hunt',group:'pic',isNew:1},{id:'pic-pirates',name:'Pirate Party',group:'pic',isNew:1},{id:'pic-velvet',name:'Velvet Plush',group:'pic',isNew:1},{id:'pic-fur',name:'Fluffy Fur',group:'pic',isNew:1},{id:'pic-picnic',name:'Picnic Fleece',group:'pic',isNew:1},{id:'pic-charms',name:'Ceramic Charms',group:'pic',isNew:1},{id:'pic-knit',name:'Cozy Knit',group:'pic',isNew:1},{id:'pic-cotton',name:'Cotton Candy',group:'pic',isNew:1},{id:'pic-jelly',name:'Jelly Candy',group:'pic',isNew:1},{id:'pic-glaze',name:'Glazed Ceramic',group:'pic',isNew:1},{id:'pic-sweater',name:'Knit Sweater',group:'pic',isNew:1},{id:'pic-fluff',name:'Cotton Fluff',group:'pic',isNew:1},{id:'pic-felt',name:'Soft Felt',group:'pic',isNew:1},{id:'pic-ceramics',name:'Ceramic Collection',group:'pic',isNew:1},{id:'pic-knits',name:'Knit Collection',group:'pic',isNew:1},{id:'pic-clouds',name:'Cloud Candy',group:'pic',isNew:1},{id:'pic-animals',name:'Animal Pals',group:'pic'},{id:'pic-sweets',name:'Sweet Treats',group:'pic'},{id:'pic-fruits',name:'Fruit Buddies',group:'pic'},{id:'pic-sky',name:'Sky Friends',group:'pic'},{id:'pic-party',name:'Kawaii Party',group:'pic'},{id:'pic-grass',name:'Lush Grass',group:'pic'},{id:'pic-jade',name:'Crystal Jade',group:'pic'},{id:'pic-sugar',name:'Sugar Crystal',group:'pic'},{id:'pic-wood',name:'Woodland',group:'pic'},{id:'pic-gems',name:'Candy Gems',group:'pic'},{id:'pic-crackers',name:'Butter Crackers',group:'pic'},{id:'pic-toast',name:'Toasty',group:'pic'},{id:'pic-waffles',name:'Waffles',group:'pic'},{id:'pic-cookies',name:'Sprinkle Cookies',group:'pic'},{id:'pic-bakery',name:'Sweet Bakery',group:'pic'},
  {id:'kawaii',name:'Kawaii'},{id:'meadow',name:'Meadow'},{id:'gummy',name:'Gummy'},{id:'kitty',name:'Kitty'},
  {id:'jade',name:'Jade Glass'},{id:'macaron',name:'Macaron'},{id:'toast',name:'Toast'},{id:'mochi',name:'Mochi'},
  {id:'sticker',name:'Stickers'},{id:'cracker',name:'Crackers'},{id:'plush',name:'Plushie Pals'},{id:'blossom',name:'Blossom'},
  {id:'sugar',name:'Sugar Stone'},{id:'cookie',name:'Sugar Cookie'},{id:'clay',name:'Clay Critters'},{id:'wood',name:'Painted Wood'},
  {id:'bricks',name:'Toy Bricks'},{id:'soda',name:'Bubble Soda'},{id:'pearl',name:'Jelly Pearls'},{id:'star',name:'Starlight'},
  {id:'pixel',name:'Pixel Pals'},{id:'classic',name:'Arcade'}
];
const OLD_HEX = ['#ff6b6b','#ff9f43','#ffd23f','#2ed6a3','#4cc9f0','#5b8cff','#a66bff','#ff7ac6','#ff9ec4','#ffb68a','#ffe27a','#8ee6c4','#8ad4ff','#9fb2ff','#c9a5ff','#ff9b9b'];
function normColor(v){
  if (v==null || v===0) return null;
  if (typeof v==='number') return v;
  if (v==='#7e86c2' || v==='#a39fba') return STONE;
  const i = OLD_HEX.indexOf(String(v).toLowerCase());
  if (i>=0) return (i%8)+1;
  let h=0; for (const ch of String(v)) h=(h*31+ch.charCodeAt(0))|0;
  return (Math.abs(h)%NCOL)+1;
}
const GEMS = {ruby:'#ff4d6d', sapphire:'#3d7bff', emerald:'#19c37d', topaz:'#ffb703'};
const GEM_KEYS = Object.keys(GEMS);
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffd23f" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';

/* ---------- shapes ---------- */
const BASE = [
  {cells:[[0,0]], w:1.6},
  {cells:[[0,0],[0,1]], w:2.6},
  {cells:[[0,0],[0,1],[0,2]], w:3},
  {cells:[[0,0],[0,1],[0,2],[0,3]], w:2.2},
  {cells:[[0,0],[0,1],[0,2],[0,3],[0,4]], w:1.4},
  {cells:[[0,0],[0,1],[1,0],[1,1]], w:3},
  {cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], w:1},
  {cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], w:1.5},
  {cells:[[0,0],[1,0],[1,1]], w:3},
  {cells:[[0,0],[1,0],[2,0],[2,1]], w:2.2},
  {cells:[[0,0],[0,1],[0,2],[1,1]], w:2},
  {cells:[[0,0],[0,1],[1,1],[1,2]], w:1.5},
  {cells:[[0,0],[1,0],[2,0],[2,1],[2,2]], w:1.1},
];
const norm = cs => {
  const mr = Math.min(...cs.map(c=>c[0])), mc = Math.min(...cs.map(c=>c[1]));
  return cs.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const SHAPES = [];
for (const b of BASE){
  const seen = new Map();
  for (const mirror of [false,true]){
    let s = mirror ? b.cells.map(([r,c])=>[r,-c]) : b.cells;
    for (let i=0;i<4;i++){ s = s.map(([r,c])=>[c,-r]); const n = norm(s); seen.set(JSON.stringify(n), n); }
  }
  const vs = [...seen.values()];
  for (const v of vs) SHAPES.push({cells:v, weight:b.w/vs.length});
}
const TOTAL_W = SHAPES.reduce((a,s)=>a+s.weight,0);
const dims = cells => ({h:Math.max(...cells.map(c=>c[0]))+1, w:Math.max(...cells.map(c=>c[1]))+1});
function makePiece(){
  let x = Math.random()*TOTAL_W, s = SHAPES[0];
  for (const sh of SHAPES){ x -= sh.weight; if (x<=0){ s = sh; break; } }
  return {cells:s.cells, ...dims(s.cells), color:1+Math.floor(Math.random()*NCOL), gem:null};
}

/* ---------- board logic ---------- */
function fits(b,p,r,c){
  if (r<0||c<0||r+p.h>N||c+p.w>N) return false;
  for (const [dr,dc] of p.cells) if (b[(r+dr)*N+c+dc]) return false;
  return true;
}
function firstFit(b,p){
  for (let r=0;r<=N-p.h;r++) for (let c=0;c<=N-p.w;c++) if (fits(b,p,r,c)) return [r,c];
  return null;
}
const canFit = (b,p) => !!firstFit(b,p);
function fullLines(b){
  const rows=[], cols=[];
  for (let i=0;i<N;i++){
    let rf=true, cf=true;
    for (let j=0;j<N;j++){ if(!b[i*N+j]) rf=false; if(!b[j*N+i]) cf=false; }
    if (rf) rows.push(i); if (cf) cols.push(i);
  }
  return {rows, cols};
}
function lineCells(rows,cols){
  const set = new Set();
  for (const r of rows) for (let j=0;j<N;j++) set.add(r*N+j);
  for (const c of cols) for (let j=0;j<N;j++) set.add(j*N+c);
  return set;
}
function placeOn(b,p,r,c){
  const nb = b.slice();
  for (const [dr,dc] of p.cells) nb[(r+dr)*N+c+dc] = p.color;
  const {rows,cols} = fullLines(nb);
  for (const i of lineCells(rows,cols)) nb[i] = null;
  return nb;
}
function setPlaceable(b,set){
  const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  for (const pm of perms){
    let bb=b, ok=true;
    for (const i of pm){ const pos=firstFit(bb,set[i]); if(!pos){ok=false;break;} bb=placeOn(bb,set[i],pos[0],pos[1]); }
    if (ok) return true;
  }
  return false;
}

/* ---------- trophy pictures (one square per level won) ---------- */
const PAL = {r:1,o:2,y:3,g:4,c:5,w:6,b:7,p:8};
const PICTURES = [
  {name:'Tulip', rows:['.r.r.r.','.rrrrr.','.rrprr.','..rrr..','...g...','.g.g.g.','..ggg..','...g...']},
  {name:'Star', rows:['....y....','...yyy...','yyyyoyyyy','.yyyyyyy.','..yyyyy..','..yy.yy..','.yy...yy.']},
  {name:'Golden Cup', rows:['y.yyyyy.y','yyyyoyyyy','.yyyyyyy.','..yyyyy..','...yyy...','....y....','....y....','..bbbbb..','.bbbbbbb.']},
  {name:'Crown', rows:['y...y...y','yy.yry.yy','yyyyyyyyy','ycyyryycy','yyyyyyyyy']},
  {name:'Diamond', rows:['.cwcccwc.','ccccccccc','.ccccccc.','..ccccc..','...ccc...','....c....']},
].map(p=>{
  const cells=[];
  p.rows.forEach((row,r)=>[...row].forEach((ch,c)=>{ if (ch!=='.') cells.push({r,c,color:PAL[ch]}); }));
  const order = cells.slice().sort((a,b)=>b.r-a.r||a.c-b.c);
  return {...p, w:Math.max(...p.rows.map(r=>r.length)), h:p.rows.length, order, count:cells.length};
});
function picState(completed){
  let left = completed;
  for (let i=0;i<PICTURES.length;i++){
    if (left < PICTURES[i].count) return {i, filled:left, allDone:false};
    left -= PICTURES[i].count;
  }
  const last = PICTURES.length-1;
  return {i:last, filled:PICTURES[last].count, allDone:true};
}
const skEl = () => Object.assign(document.createElement('i'),{className:'sk'});
function renderPicture(el, pic, filled, cell, animLast){
  el.innerHTML='';
  el.style.gridTemplateColumns=`repeat(${pic.w},${cell}px)`;
  el.style.gridTemplateRows=`repeat(${pic.h},${cell}px)`;
  el.style.gap=Math.max(1, Math.round(cell*0.1))+'px';
  pic.order.forEach((o,k)=>{
    const d=document.createElement('div');
    d.style.gridRow=o.r+1; d.style.gridColumn=o.c+1;
    if (k<filled){
      d.className='blk'; d.dataset.k=o.color; d.style.setProperty('--c',kv(o.color)); d.append(skEl());
      if (animLast && k===filled-1) d.classList.add('newfill');
    } else { d.className='pc-empty'; d.style.setProperty('--c',kv(o.color)); }
    el.append(d);
  });
}

/* ---------- level generator (seeded so a level is the same on retry) ---------- */
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1|seed);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function shuffle(a,R){ a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function genLevel(L){
  const R = rng(L*7919+13);
  const nTypes = L<=3 ? 1 : L<=10 ? 2 : (L%4===0 ? 3 : 2);
  const types = shuffle(GEM_KEYS,R).slice(0,nTypes);
  const total = Math.min(22, 3 + Math.floor(L*0.45) + nTypes);
  const goals = types.map(t=>({type:t, need:0, got:0}));
  for (let k=0;k<total;k++) goals[k%nTypes].need++;
  const board = Array(N*N).fill(null), gems = Array(N*N).fill(null);
  const target = Math.round(N*N*Math.min(0.36, 0.14 + L*0.007));
  let guard = 0;
  while (board.filter(Boolean).length < target && guard++ < 600){
    const r = Math.floor(R()*N), c = Math.floor(R()*4);
    board[r*N+c] = STONE; board[r*N+(N-1-c)] = STONE;
  }
  let fl = fullLines(board);
  while (fl.rows.length || fl.cols.length){
    for (const r of fl.rows) board[r*N+Math.floor(R()*N)] = null;
    for (const c of fl.cols) board[Math.floor(R()*N)*N+c] = null;
    fl = fullLines(board);
  }
  const filled = shuffle(board.map((v,i)=>v?i:-1).filter(i=>i>=0), R);
  let gi = 0;
  for (const g of goals){
    const onBoard = Math.ceil(g.need*0.6);
    for (let k=0;k<onBoard && gi<filled.length;k++) gems[filled[gi++]] = g.type;
  }
  return {board, gems, goals};
}

/* ---------- storage ---------- */
const K_CLASSIC='blockbloom:v1', K_BEST='blockbloom:best', K_SND='blockbloom:sound', K_ADV_LVL='blockbloom:adv:level', K_ADV_RUN='blockbloom:adv:run', K_SKIN='blockbloom:skin';
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  json(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
};

function save(){

  else if (!S.won) store.set(K_ADV_RUN, JSON.stringify(S));
}
function addGemsToTray(set){
  if (S.mode!=='adventure') return;
  const needed = S.goals.filter(g=>g.got<g.need);
  if (!needed.length) return;
  const per = needed.map(g=>({t:g.type, d:(g.need-g.got) - S.gems.filter(x=>x===g.type).length}));
  let given = 0;
  for (const p of set){
    const short = per.filter(x=>x.d>0);
    if (short.length && Math.random()<0.55){
      const x = short[Math.floor(Math.random()*short.length)];
      p.gem = {k:Math.floor(Math.random()*p.cells.length), t:x.t}; x.d--; given++;
    } else if (Math.random()<0.07){
      const g = needed[Math.floor(Math.random()*needed.length)];
      p.gem = {k:Math.floor(Math.random()*p.cells.length), t:g.type}; given++;
    }
  }
  const neededOnBoard = S.gems.some(x=>x && needed.some(g=>g.type===x));
  if (!given && !neededOnBoard){
    const p=set[0], x=per.find(x=>x.d>0) || per[0];
    p.gem = {k:Math.floor(Math.random()*p.cells.length), t:x.t};
  }
}
function refill(){
  let set=null;
  for (let t=0;t<60 && !set;t++){ const s=[makePiece(),makePiece(),makePiece()]; if (setPlaceable(S.board,s)) set=s; }
  for (let t=0;t<60 && !set;t++){ const s=[makePiece(),makePiece(),makePiece()]; if (s.some(p=>canFit(S.board,p))) set=s; }
  if (!set) set=[makePiece(),makePiece(),makePiece()];
  S.tray = set;
  addGemsToTray(set);
}
function newClassic(){
  S = {mode:'classic', board:Array(N*N).fill(null), gems:Array(N*N).fill(null), tray:null,
       score:0, combo:0, since:0, over:false, won:false, bestAtStart:best};
  shownScore = 0;
  refill(); save();
}
function newLevel(L){

       score:0, combo:0, since:0, over:false, won:false};

}
function migrate(st){
  st.board = st.board.map(normColor);
  st.tray = st.tray.map(t=>t ? {...t, color:normColor(t.color)||1} : null);

}
function validRun(s){
  return s && Array.isArray(s.board) && s.board.length===N*N && Array.isArray(s.tray) && s.tray.length===3;

function openClassic(){

    if (S.tray.every(t=>!t)) refill();
  } else newClassic();
  shownScore = S.score;
  enterGame(true);
}
function openLevel(L, fresh){
  const s = store.json(K_ADV_RUN);
  if (!fresh && validRun(s) && s.mode==='adventure' && s.level===L && !s.over && !s.won){
    S = migrate(s);
    if (S.tray.every(t=>!t)) refill();
  } else newLevel(L);
  enterGame(true);
}
function enterGame(intro){
  closeModal(overEl); closeModal(pauseEl);
  show('game');
  shownGot = {};
  if (S.mode==='adventure') for (const g of S.goals) shownGot[g.type]=g.got;
  renderAll(true);

  const left = S.tray.filter(Boolean);
  if (left.length && left.every(p=>!canFit(S.board,p))){ S.over=true; save(); setTimeout(showLose, 400); }
}

function renderScore(){
  const from=shownScore, to=S.score;
  if (from===to){ scoreEl.textContent=to.toLocaleString(); return; }
  scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
  const t0=performance.now(), dur=Math.min(650, 140+Math.abs(to-from)*3);
  shownScore=to;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    scoreEl.textContent=Math.round(from+(to-from)*e).toLocaleString();
    if (k<1 && shownScore===to) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  if (adv) $('lvlTxt').textContent = `LEVEL ${S.level}`;
  renderBoard(); renderTray(deal);

  const fresh = adv ? S.goals.every(g=>g.got===0) && S.tray.filter(Boolean).length===3 : S.score===0;

function rel(el){ const f=frameEl.getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:r.left-f.left, y:r.top-f.top, w:r.width, h:r.height}; }
function burst(idx,k){

      {transform:`translate(${dx}px,${dy+r.h*2.8}px) rotate(${Math.random()*720}deg) scale(.3)`,opacity:0}

function sweep(rows,cols){
  const first=rel(cellEls[0]), last=rel(cellEls[N*N-1]);

  const add=(x,y,w,h,dir)=>{ const d=document.createElement('div'); d.className='sweep '+dir; d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`; fxEl.append(d); setTimeout(()=>d.remove(),600); };
  rows.forEach(r=>{ const c=rel(cellEls[r*N]); add(first.x,c.y,W,c.h,'h'); });
  cols.forEach(cc=>{ const c=rel(cellEls[cc]); add(c.x,first.y,c.w,H,'v'); });
}

/* ---------- sound ---------- */
let ac=null;
function tone(f,t,dur,type,vol){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function sfx(kind,n){
  if (!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    if (kind==='pick') tone(560,t,.05,'sine',.06);
    if (kind==='place'){ tone(196,t,.09,'triangle',.18); tone(392,t,.05,'sine',.05); }
    if (kind==='clear'){ const base=523.25*Math.pow(2,Math.min(n,8)/12); [0,4,7,12].forEach((s,k)=>tone(base*Math.pow(2,s/12),t+k*0.06,.22,'triangle',.12)); }
    if (kind==='ready'){ const f=880*Math.pow(2,Math.min(n,5)*2/12); tone(f,t,.12,'sine',.05); tone(f*1.5,t+.04,.14,'sine',.035); }
    if (kind==='gem'){ tone(1318.5,t,.12,'sine',.08); tone(1975.5,t+.05,.14,'sine',.05); }
    if (kind==='win') [523.25,659.25,783.99,1046.5,1318.5].forEach((f,k)=>tone(f,t+k*0.09,.35,'triangle',.12));
    if (kind==='over') [392,330,262,196].forEach((f,k)=>tone(f,t+k*0.14,.3,'sine',.12));
  }catch(e){}
}
/* Haptics. Android: the Vibration API. iPhone (iOS 17.4+): Safari has no Vibration API,
   but toggling a native switch control gives a system haptic tap, so we click a hidden one. */
const canVibrate = typeof navigator.vibrate === 'function';
let hapLabel = null;
function iosTap(){
  try{
    if (!hapLabel){
      hapLabel = document.createElement('label');
      hapLabel.setAttribute('aria-hidden','true');
      hapLabel.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
      const inp = document.createElement('input');
      inp.type='checkbox'; inp.setAttribute('switch',''); inp.tabIndex=-1;
      hapLabel.append(inp); document.body.append(hapLabel);
    }
    hapLabel.click();
  }catch(e){}
}
function buzz(pattern){
  if (!hapticsOn) return;
  try{
    if (canVibrate){ navigator.vibrate(pattern); return; }
    // iOS gives one light tap per toggle, so a pattern [on,off,on,...] becomes a tap at the start of each "on".
    const p = Array.isArray(pattern) ? pattern : [pattern];
    let at = 0;
    for (let i=0;i<p.length;i+=2){
      if (at===0) iosTap(); else setTimeout(iosTap, at);
      at += (p[i]||0) + Math.max(p[i+1]||0, 70);
    }
  }catch(e){}
}

/* ---------- modals ---------- */
function closeModal(el){ el.hidden=true; el.innerHTML=''; }
function showModal(el, o, actions){
  el.innerHTML = `${o.rays?'<div class="rays"></div>':''}<div class="panel mpanel${o.rays?' wide-ribbon':''}"><div class="ribbon ${o.color||''}"><span class="ot">${o.ribbon}</span></div>${o.corner||''}${o.body||''}<div class="mbtns">${
    o.buttons.map(b=>`<button class="gbtn ${b.color||''} ${b.small?'sm':''}" data-act="${b.act}" type="button"><span class="${b.color==='cream'?'':'ot'}">${b.label}</span></button>`).join('')}</div></div>`;
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.act]()));
  el.hidden=false;
  const first=el.querySelector('.gbtn'); if (first) first.focus({preventScroll:true});
}
function openPause(){
  if (drag || !S) return;
  const sndIco = soundOn
    ? '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const hapIco = hapticsOn
    ? '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4.5 8.5l-1.5 1.8 1.5 1.7-1.5 1.8 1.5 1.7M19.5 8.5l1.5 1.8-1.5 1.7 1.5 1.8-1.5 1.7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4 5l16 14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  showModal(pauseEl,{ribbon:'Paused', color:'blue',
    corner:`<div class="corners"><button class="ibtn ${hapticsOn?'':'orange'} corner" data-act="haptics" type="button" aria-label="Vibration ${hapticsOn?'on':'off'}">${hapIco}</button><button class="ibtn ${soundOn?'':'orange'} corner" data-act="sound" type="button" aria-label="Sound ${soundOn?'on':'off'}">${sndIco}</button></div>`,
    body:`<p>${S.mode==='adventure'?`Level ${S.level}`:`Score ${S.score.toLocaleString()}`}</p>`, buttons:[
    {label:'Resume', act:'resume'},
    {label: S.mode==='adventure'?'Restart Level':'New Game', act:'restart', color:'cream', small:true},
    {label:'Block Styles', act:'styles', color:'cream', small:true},
    {label: S.mode==='adventure'?'Map':'Home', act:'home', color:'cream', small:true},
  ]},{
    resume:()=>closeModal(pauseEl),
    restart:()=>{ closeModal(pauseEl); if (S.mode==='adventure') openLevel(S.level,true); else { newClassic(); enterGame(true); } },
    styles:()=>openStyles('game'),
    sound:()=>{ soundOn=!soundOn; store.set(K_SND, soundOn?'1':'0'); openPause(); if (soundOn) sfx('pick'); },
    haptics:()=>{ hapticsOn=!hapticsOn; store.set(K_HAP, hapticsOn?'1':'0'); openPause(); buzz(15); },
    home:()=>{ closeModal(pauseEl); save(); show(S.mode==='adventure'?'map':'home'); }
  });
}
function showLose(){
  if (screen!=='game' || !S.over) return;
  sfx('over'); buzz([20,60,20]);
  if (S.mode==='classic'){
    const nb = S.score>0 && S.score>S.bestAtStart;
    showModal(overEl,{rays:nb, ribbon: nb?'New Best!':'Game Over', color: nb?'gold':'purple', body:`
      <div class="lbl">Score</div><div class="big">${S.score.toLocaleString()}</div>
      <div class="lbl">Best</div><div class="sm">${best.toLocaleString()}</div>`,
      buttons:[{label:'Play Again', act:'again'},{label:'Home', act:'home', color:'cream', small:true}]},
      {again:()=>{ closeModal(overEl); newClassic(); enterGame(true); }, home:()=>{ closeModal(overEl); show('home'); }});
    if (nb) confetti(overEl);
  } else {
    showModal(overEl,{ribbon:'Out of Room', color:'red', body:`
      <p>So close! Still to collect:</p>
      <div class="panel goal-panel">${S.goals.filter(g=>g.got<g.need).map(g=>goalHTML(g,g.got)).join('')}</div>`,
      buttons:[{label:'Try Again', act:'retry'},{label:'Map', act:'map', color:'cream', small:true}]},
      {retry:()=>openLevel(S.level,true), map:()=>{ closeModal(overEl); show('map'); }});
  }
}
function showWin(){
  if (screen!=='game' || !S.won) return;
  sfx('win'); buzz([15,40,15,40,30]);
  const before = picState(S.level-1);
  const pic = PICTURES[before.i];
  const bonus = before.allDone;
  const filled = bonus ? pic.count : before.filled+1;
  const done = !bonus && filled===pic.count;
  showModal(overEl,{rays:true, ribbon:'Level Complete!', color:'green', body:`
    <div class="stars3" aria-hidden="true">${ICON_STAR}${ICON_STAR}${ICON_STAR}</div>
    <p>${bonus ? `Level ${S.level} · bonus round` : done ? `You finished the ${pic.name} trophy!` : `Level ${S.level} · ${pic.name} ${filled} / ${pic.count}`}</p>
    <div class="pic" id="overPic"></div>
    ${done ? '<div class="badge"><span class="ot">Trophy won!</span></div>' : ''}`,
    buttons:[{label:'Next Level', act:'next'},{label:'Map', act:'map', color:'cream', small:true}]},
    {next:()=>openLevel(advLevel,true), map:()=>{ closeModal(overEl); show('map'); }});
  const cell = Math.max(8, Math.min(22, Math.floor(190/pic.w), Math.floor(150/pic.h)));
  $('overPic').classList.add('tiny');
  renderPicture($('overPic'), pic, filled, cell, true);
  confetti(overEl);
}

/* ---------- navigation ---------- */
$('goAdv').addEventListener('click',()=>show('map'));
$('goClassic').addEventListener('click',openClassic);
$('goStyles').addEventListener('click',()=>openStyles('home'));
$('playLevel').addEventListener('click',()=>openLevel(advLevel,false));
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>show('home')));
$('pauseBtn').addEventListener('click',openPause);
$('styleBtn').addEventListener('click',()=>{ if (!drag) openStyles('game'); });
$('stylesBack').addEventListener('click',()=>{ if (stylesReturn==='game' && S){ show('game'); renderTray(false); } else show('home'); });

/* ---------- placing ---------- */
const WORDS = {2:'Great!',3:'Amazing!',4:'Incredible!',5:'Unreal!',6:'Legendary!'};
function commit(i,r,c){
  const p=S.tray[i];
  S.tray[i]=null;
  p.cells.forEach(([dr,dc],k)=>{
    const idx=(r+dr)*N+c+dc;
    S.board[idx]=p.color;
    S.gems[idx]=(p.gem && p.gem.k===k) ? p.gem.t : null;
  });
  const adv = S.mode==='adventure';
  let gained=p.cells.length;
  const {rows,cols}=fullLines(S.board);
  const lines=rows.length+cols.length;
  const cleared=lineCells(rows,cols);
  const popped=[], flights=[];
  for (const idx of cleared){
    popped.push([idx, S.board[idx]]);
    const g=S.gems[idx];
    if (g && adv){
      const goal=S.goals.find(x=>x.type===g);
      if (goal && goal.got<goal.need){ goal.got++; flights.push([idx,g]); }
    }
    S.board[idx]=null; S.gems[idx]=null;
  }
  // where the piece landed, for the score popup
  const a=rel(cellEls[r*N+c]), b=rel(cellEls[(r+p.h-1)*N+(c+p.w-1)]);
  const cx=(a.x+b.x+b.w)/2, cy=(a.y+b.y+b.h)/2;

  if (lines){
    S.combo++; S.since=0;
    let lineScore=0;
    if (!adv){
      const mult = 1 + 0.5*(S.combo-1);
      lineScore = Math.round(18*lines*(lines+1)/2 * mult);
      gained += lineScore;
    }
    const allClear = S.board.every(v=>!v);
    if (allClear && !adv) gained += 300;
    if (allClear) banner('Perfect!','');
    else if (WORDS[Math.min(lines,6)]) banner(WORDS[Math.min(lines,6)], '');
    if (S.combo>=2) banner('Combo ×'+S.combo,'',true,120);
    if (!adv) popScore('+'+(lineScore+(allClear?300:0)), cx, cy);
    sweep(rows,cols);
    sfx('clear', lines+S.combo);
    buzz(lines>=3?[14,40,14,40,14,40,20]:lines===2?[14,40,14,40,18]:[16,40,16]);
    if (lines>=2){ frameEl.classList.remove('shake'); void frameEl.offsetWidth; frameEl.classList.add('shake'); }
  } else {
    S.since++;
    if (S.since>=3){ S.combo=0; S.since=0; }
    sfx('place'); buzz(8);
  }
  if (!adv){
    S.score += gained;
    if (S.score>best){ best=S.score; store.set(K_BEST, String(best)); }
  }
  if (adv && S.goals.every(g=>g.got>=g.need)){
    S.won = true;
    advLevel = S.level+1;
    store.set(K_ADV_LVL, String(advLevel));
    store.del(K_ADV_RUN);
    mapAnim = true;
  }

  let deal=false;
  if (S.tray.every(t=>!t) && !S.won){ refill(); deal=true; }
  renderAll(deal);

  p.cells.forEach(([dr,dc])=>{
    const idx=(r+dr)*N+c+dc;
    if (S.board[idx]){ const el=cellEls[idx]; el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); setTimeout(()=>el.classList.remove('land'),460); }
  });
  for (const [idx,col] of popped){
    const el=cellEls[idx];
    const rr=Math.floor(idx/N), cc=idx%N;
    el.style.setProperty('--pc', kv(col));
    el.style.setProperty('--d', (Math.abs(rr-r-p.h/2)+Math.abs(cc-c-p.w/2))*16+'ms');
    el.classList.add('pop');
    setTimeout(()=>el.classList.remove('pop'), 900);
    burst(idx,col);
  }
  flights.forEach(([idx,g],k)=>{
    setTimeout(()=>flyGem(idx,g,()=>{
      shownGot[g] = (shownGot[g]||0)+1;
      renderGoals();
      const chip = goalsEl.querySelector(`[data-goal="${g}"]`);
      if (chip) chip.classList.add('bump');
      sfx('gem');
    }), k*70);
  });

  if (S.won){
    setTimeout(()=>banner('Level Complete!','green'), 250 + flights.length*70);
    setTimeout(showWin, 1250 + flights.length*70);
  } else {
    const left=S.tray.filter(Boolean);
    if (left.length && left.every(pp=>!canFit(S.board,pp))){
      S.over=true;
      setTimeout(showLose, 900);
    }
  }
  save();
}

/* ---------- dragging ---------- */
let drag=null;
function geom(){
  const a=cellEls[0].getBoundingClientRect(), b=cellEls[1].getBoundingClientRect(), d=cellEls[N].getBoundingClientRect();
  return {ox:a.left, oy:a.top, size:a.width, step:b.left-a.left, stepY:d.top-a.top};
}
// Only the handful of cells under the piece (and lines it would clear) are touched while dragging.
let pv = new Map();   // cell index -> 'g' | 'w' currently shown
function restoreCell(idx){
  const el=cellEls[idx], v=S.board[idx];
  if (v){ el.dataset.k=v; el.style.setProperty('--c',kv(v)); } else { delete el.dataset.k; el.style.removeProperty('--c'); }
}
function applyPreview(next, color){
  for (const [idx,cls] of pv){ if (next.get(idx)!==cls){ cellEls[idx].classList.remove(cls); if (!next.has(idx)) restoreCell(idx); } }
  for (const [idx,cls] of next){
    const el=cellEls[idx];
    if (pv.get(idx)!==cls){ el.dataset.k=color; el.style.setProperty('--c',kv(color)); el.classList.add(cls); }
  }
  pv = next;
}
let glowKey='', glowEls=[];
function setLineGlow(rows,cols){
  const key=rows.join(',')+'|'+cols.join(',');
  if (key===glowKey) return;
  const before=glowEls.length;
  glowEls.forEach(el=>el.remove()); glowEls=[]; glowKey=key;
  if (!rows.length && !cols.length) return;
  const first=rel(cellEls[0]), last=rel(cellEls[N*N-1]);
  const W=last.x+last.w-first.x, H=last.y+last.h-first.y;
  const add=(x,y,w,h,v)=>{ const d=document.createElement('div'); d.className='lineglow'+(v?' v':''); d.style.cssText=`left:${x-2}px;top:${y-2}px;width:${w+4}px;height:${h+4}px`; fxEl.append(d); glowEls.push(d); };
  rows.forEach(r=>{ const c=rel(cellEls[r*N]); add(first.x,c.y,W,c.h,false); });
  cols.forEach(cc=>{ const c=rel(cellEls[cc]); add(c.x,first.y,c.w,H,true); });
  if (glowEls.length>before){ sfx('ready', glowEls.length); buzz(6); }
}
function clearPreview(){ applyPreview(new Map()); setLineGlow([],[]); }
function preview(p,r,c){
  const nb=S.board.slice(), next=new Map();
  for (const [dr,dc] of p.cells){ const idx=(r+dr)*N+c+dc; nb[idx]=p.color; next.set(idx,'g'); }
  const {rows,cols}=fullLines(nb);
  for (const idx of lineCells(rows,cols)) next.set(idx,'w');
  applyPreview(next, p.color);
  setLineGlow(rows,cols);
}
function moveDrag(e){
  const g=drag.g;
  let x=drag.px0 + (e.clientX-drag.sx)*drag.gain, y=drag.py0 + (e.clientY-drag.sy)*drag.gain;
  x=Math.max(-drag.pw/2, Math.min(window.innerWidth-drag.pw/2, x));
  y=Math.max(-drag.ph/2, Math.min(window.innerHeight-drag.ph/2, y));
  drag.el.style.transform=`translate(${x}px,${y}px)`;
  const c=Math.round((x-g.ox)/g.step), r=Math.round((y-g.oy)/g.stepY);
  if (fits(S.board,drag.p,r,c)){
    if (!drag.target || drag.target[0]!==r || drag.target[1]!==c){ drag.target=[r,c]; preview(drag.p,r,c); }
  } else if (drag.target){ drag.target=null; clearPreview(); }
}
document.addEventListener('pointerdown',()=>{ if (soundOn && !ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },{once:true,capture:true});
trayEl.addEventListener('pointerdown',e=>{
  const slot=e.target.closest('.slot');
  if (!slot || drag || !S || S.over || S.won || !overEl.hidden || !pauseEl.hidden) return;
  const i=+slot.dataset.i, p=S.tray[i];
  if (!p) return;
  e.preventDefault();
  const g=geom(), gap=g.step-g.size;
  const el=document.createElement('div');
  el.className='drag'; el.dataset.skin=skin;
  el.append(pieceEl(p,g.size,gap));
  document.body.append(el);
  const pw=p.w*g.step-gap, ph=p.h*g.stepY-gap;
  const lift = e.pointerType==='mouse' ? ph/2 : ph + g.step*0.9;
  const gain = e.pointerType==='mouse' ? 1 : 1.5;
  drag={i,p,el,g,pw,ph,lift,gain,sx:e.clientX,sy:e.clientY,px0:e.clientX-pw/2,py0:e.clientY-lift,pid:e.pointerId,target:null,slot};
  slot.classList.add('dragging');
  try{ trayEl.setPointerCapture(e.pointerId); }catch(err){}
  sfx('pick'); buzz(5);
  moveDrag(e);
});
trayEl.addEventListener('pointermove',e=>{ if (drag && e.pointerId===drag.pid) moveDrag(e); });
function endDrag(e){
  if (!drag || e.pointerId!==drag.pid) return;
  const d=drag; drag=null;
  d.el.remove();
  clearPreview();
  d.slot.classList.remove('dragging');
  if (d.target && e.type==='pointerup') commit(d.i, d.target[0], d.target[1]);
}
trayEl.addEventListener('pointerup',endDrag);
trayEl.addEventListener('pointercancel',endDrag);
trayEl.addEventListener('lostpointercapture',e=>{ if (drag && e.pointerId===drag.pid) endDrag({pointerId:e.pointerId,type:'pointercancel'}); });
trayEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{ if (drag) e.preventDefault(); },{passive:false});

let rT=null;
window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if (screen==='game' && S) renderTray(false); if (screen==='map') renderMap(); },120); });

/* ---------- boot ---------- */
applySkin();
function start(data){
  const snap = data || {};
  if (snap.screen==='game' && snap.mode==='adventure' && !snap.won) openLevel(advLevel,false);
  else if (snap.screen==='game' && snap.mode==='classic') openClassic();
  else show(snap.screen==='map' ? 'map' : snap.screen==='styles' ? 'styles' : 'home');
}
try{ window.claude?.hot?.snapshot?.(()=>({screen, mode:S&&S.mode, won:S&&S.won})); }catch(e){}
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
})();
</script>
